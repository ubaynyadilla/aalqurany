<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: halaman mushaf mengisi penuh layar termasuk area notch -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- PWA: manifest + pengaturan "Add to Home Screen" untuk Safari iOS -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aalqurany" />
    <meta name="theme-color" content="#f6f1e4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)" />
    <!-- theme-color tanpa media: diupdate JS saat tema berganti (untuk navigation bar Android) -->
    <meta name="theme-color" content="#f6f1e4" />
    <title>aalqurany</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
